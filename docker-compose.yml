name: communaute-lerevenu

services:
  postgres:
    image: postgres:17-alpine
    container_name: communaute_lerevenu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?lancez avec --env-file backend/.env}
      POSTGRES_USER: ${DATABASE_USERNAME:?lancez avec --env-file backend/.env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?lancez avec --env-file backend/.env}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}']
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    container_name: communaute_lerevenu_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      SESSION_COOKIE_SECURE: 'false'
    ports:
      - '${BACKEND_PORT:-1337}:1337'
    volumes:
      - strapi_uploads:/app/public/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:1337/_health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STRAPI_URL: http://localhost:${BACKEND_PORT:-1337}
    container_name: communaute_lerevenu_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      NODE_ENV: production
      STRAPI_INTERNAL_URL: http://backend:1337
      PORT: 3000
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  pg_data:
  strapi_uploads:
